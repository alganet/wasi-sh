<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- wasi-sh use case B with a real terminal: xterm.js loaded from a CDN.
     xterm is NOT a dependency of wasi-sh — the integration is the two marked
     lines below (keystrokes → session.write, session.onOutput → term.write).
     They are the WHOLE integration because the shell is given a tty and does
     its own line editing: prompt, echo, history, arrows and tab completion.

     Interactive sessions need cross-origin isolation (SharedArrayBuffer):
     serve with `npm run serve`, or on a static host add COOP/COEP headers or
     a service-worker shim such as https://github.com/gzuidhof/coi-serviceworker -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wasi-sh REPL — cmdsubst · pipes · isolation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css">
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#c5c8c6;font-family:ui-monospace,monospace}
  header{padding:8px 12px;font-size:13px;color:#8a8f98;border-bottom:1px solid #1c2230}
  header b{color:#d7dae0}
  #bar{padding:6px 12px;border-bottom:1px solid #1c2230;font-size:12px;color:#8a8f98}
  #bar button{background:#141a26;color:#9cc4ff;border:1px solid #24304a;border-radius:5px;
    padding:3px 8px;margin:2px 3px 2px 0;font:inherit;font-size:11px;cursor:pointer}
  #bar button:hover{background:#1b2436}
  #term{position:absolute;top:96px;bottom:0;left:0;right:0;padding:6px 8px}
  code{color:#c5b3ff}
</style>
</head>
<body>
<header>
  <b>busybox ash</b> via <code>wasi-sh</code> — plain <code>wasm32-wasi</code>,
  <b>fork stubbed to ENOSYS</b>, yet <code>$(...)</code>, pipes and subshell isolation
  work (fork-free, in-process). Builtins only — there is no <code>exec</code>.
</header>
<div id="bar">Try:
  <button data-cmd='echo "today: $(date 2>/dev/null || echo no-date-applet), pid $$"'>cmdsubst</button>
  <button data-cmd='printf "3\n1\n2\n" | while read n; do echo "line $n"; done'>pipe → while read</button>
  <button data-cmd='x=$(y=5; echo captured); echo "x=[$x]  y=[$y]  (y did NOT leak)"'>isolation</button>
  <button data-cmd='a=1; b=$(a=99; echo "$a"); echo "inner saw a=$b, outer a=$a (restored)"'>restore on exit</button>
  <button data-cmd='echo "$(i=1; while [ $i -le 5 ]; do printf "%s " $((i*i)); i=$((i+1)); done)"'>squares</button>
  <button data-cmd='set +e; z=$(set -e; false; echo unreached); echo "z=[$z] rc=$? — parent errexit still off"'>set -e contained</button>
  <button data-cmd='echo hi | read foo; echo "foo=[$foo]  (pipe stage is a subshell)"'>pipe subshell</button>
  <button data-cmd='w=$(printf "a b c" | while read p q r; do echo "$r$q$p"; done); echo "[$w]"'>nested pipe in $()</button>
  <button data-cmd='r=$(exit 7); echo "rc=$?  (exit status propagates)"; echo still-alive'>exit status</button>
  <button data-cmd='echo "spinning — press Ctrl-C"; awk "BEGIN{for(;;)i++}"; echo "stopped, rc=$? — and the shell is still here"'>runaway awk (^C)</button>
  <br>Browser bridges:
  <button data-cmd='printf "\033]0;busybox @ wasi-sh\007"; echo "title set — look at the browser tab"'>set tab title</button>
  <button data-cmd='printf "\033]52;c;aGVsbG8gZnJvbSB3YXNpLXNoIPCfk4s=\007"; echo "copied \"hello from wasi-sh\" — paste it anywhere"'>copy to clipboard</button>
  <button data-cmd='printf "\033]52;c;?\007"; read -t 1 -r r; r=${r#*;c;}; r=${r%??}; [ -n "$r" ] && printf "clipboard (base64, this build has no base64 -d): %s\n" "$r" || echo "no reply — the browser blocked the read (needs a recent click + permission)"'>read clipboard</button>
</div>
<div id="term"></div>
<script type="module">
import { Terminal } from "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm";
import { FitAddon } from "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm";
import { spawn } from "../src/index.mjs";

// convertEol: the guest has no tty line discipline (no ONLCR), so its output
// is LF-only — let xterm supply the CR. (A raw-drawing TUI that emits its own
// \r and cursor addressing, like tuish, would set false instead.)
const term = new Terminal({ cursorBlink:true, fontSize:14, convertEol:true, theme:{background:"#0b0e14"} });
const fit = new FitAddon(); term.loadAddon(fit);
term.open(document.getElementById("term")); fit.fit();
addEventListener("resize", () => fit.fit());
const say = (s) => term.write(s);

// ── No line editor here, and that is the point ──────────────────────────────
// The shell has its own: prompt, echo, history, arrow keys, ^C and TAB
// COMPLETION, all inside the guest (libbb/lineedit.c). `tty: true` below is
// what turns it on — it makes isatty(0)/isatty(1) true, which is the only
// thing ash checks before running its editor.
//
// So this page does not track a current line, does not draw a prompt, and does
// not need a sentinel to know when a command finished. Every byte goes down,
// every byte comes back up. That is the whole integration.
let session;
try {
  say("Loading busybox.wasm…\r\n");
  session = await spawn({
    args: ["busybox", "sh"],
    // The shell owns the line. Drop this and you get the old arrangement: no
    // prompt, no echo, and a page that has to edit lines itself.
    tty: true,
    // PS1 is plain text on purpose: this build has FEATURE_EDITING_FANCY_PROMPT
    // off, so the editor measures the prompt with strlen() — a colour escape in
    // here would count as visible width and put the cursor in the wrong column.
    //
    // COLUMNS/LINES seed the guest's initial size (fit.fit() ran above, so
    // term.cols/rows are the real geometry). A later resize is delivered live
    // via session.resize() below — see the term.onResize wiring.
    env: { PS1: "$ ", LC_ALL: "C", COLUMNS: String(term.cols), LINES: String(term.rows) },
  });
} catch (e) {
  say("\r\n\x1b[31m" + (e?.message || e) + "\x1b[0m\r\n");
  throw e;
}

// ── Resize bridge: window resize → xterm reflow → live geometry to the guest ──
// The window listener (above) calls fit.fit(), which re-lays xterm's grid and
// fires onResize with the new cols/rows. session.resize() stores that geometry
// and synthesizes a SIGWINCH in the guest — so `stty size` reports the new size
// and a shell with `trap ... WINCH` (e.g. tuish) relayouts. No re-spawn.
term.onResize(({ cols, rows }) => session.resize(cols, rows));

// ── Two browser↔shell bridges, both on the terminal wire (no wasi-sh change) ──
// The shell speaks to the browser in plain escape bytes on stdout; the browser
// answers (when it answers) as bytes on stdin. Same code path as a real
// terminal over ssh — these are the host's half of the contract.

// Title: the guest emits OSC 0/2 (`ESC ] 0 ; text BEL`); xterm decodes it and
// fires onTitleChange. One line marries it to the tab.
term.onTitleChange((t) => { document.title = t || document.title; });

// Clipboard, BOTH directions, over OSC 52. UTF-8-safe base64 (btoa is byte-wise,
// so encode/decode through Text{Encoder,Decoder}, not raw charCodes).
const b64FromText = (s) => { const u = new TextEncoder().encode(s); let bin = "";
  for (const b of u) bin += String.fromCharCode(b); return btoa(bin); };
const textFromB64 = (b) => new TextDecoder().decode(
  Uint8Array.from(atob(b), (c) => c.charCodeAt(0)));

term.parser.registerOscHandler(52, (data) => {
  const payload = data.slice(data.indexOf(";") + 1);   // strip the "c;" selection
  if (payload === "?") {
    // READ (`ESC ] 52 ; c ; ? ST`): the browser gates readText() on permission
    // and a recent user gesture — that check is exactly why letting the shell
    // read the clipboard is safe here (in a bare terminal it would not be). The
    // answer goes back as an OSC 52 on stdin; the app reads it (see the demo).
    navigator.clipboard?.readText()
      .then((text) => session?.write("\x1b]52;c;" + b64FromText(text) + "\x1b\\"))
      .catch((e) => console.warn("[clipboard] read refused:", e.message));
    return true;
  }
  // WRITE (`ESC ] 52 ; c ; <base64> ST`): put the payload on the system clipboard.
  try {
    navigator.clipboard?.writeText(textFromB64(payload))
      .catch((e) => console.warn("[clipboard] write refused:", e.message));
  } catch (e) { console.warn("[clipboard] bad OSC 52 payload:", e.message); }
  return true;
});

session.onOutput((bytes) => term.write(bytes));                 // shell → terminal

session.exited.then((code) => say("\r\n[shell exited: " + code + "]\r\n"));
session.onError((e) => say("\r\n[error: " + e.message + "]\r\n"));

term.onData((d) => {                                           // keyboard → shell
  session.write(d);
  // ^C goes down as a BYTE — the guest's editor wants it, and at a prompt it
  // is what abandons the half-typed line. It also gets sent as an interrupt,
  // because a wasm guest has no signals: session.interrupt() is what actually
  // stops a runaway applet. Unconditional, and safe to be: a ^C posted while
  // nothing is running cancels nothing, by contract.
  if (d.includes("\x03")) session.interrupt();
});

// clickable examples: type the command into the shell
for (const btn of document.querySelectorAll("#bar button")){
  btn.addEventListener("click", () => {
    // Typed, not run: the guest echoes it and runs it, exactly as if the keys
    // had been pressed. Nothing here has to know whether the shell is busy.
    session.write(btn.getAttribute("data-cmd") + "\r");
    term.focus();
  });
}

say("\x1b[38;5;250mbusybox ash — fork-free command substitution, pipes & subshell isolation.\x1b[0m\r\n");
say("\x1b[38;5;244mType a command, or click an example above. (builtins only — no exec)\x1b[0m\r\n");
say("\x1b[38;5;244mThe shell edits its own line: TAB completes, Up/Down are history.\x1b[0m\r\n");
say("\x1b[38;5;244mThe 'Browser bridges' row talks to the tab title and the system clipboard, both ways.\x1b[0m\r\n");
say("\x1b[38;5;244mCtrl-C while a command runs is a cooperative interrupt — try 'runaway awk'.\x1b[0m\r\n");
term.focus();
</script>
</body>
</html>
